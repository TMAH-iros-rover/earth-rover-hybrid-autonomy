project:
  name: earth-rover-hybrid-autonomy
  mode: urban
  loop_hz: 5

sdk:
  base_url: "http://localhost:8000"
  # Agora RTM control acknowledgement is commonly slower than 250 ms on the
  # Wuhan link. Allow the observed round trip plus transient network jitter;
  # otherwise a successfully delivered command can look like a failure.
  request_timeout_sec: 1.0
  max_consecutive_failures: 3

control:
  linear_min: -0.25
  linear_max: 0.35
  angular_min: -0.70
  angular_max: 0.70

  base_linear: 0.22
  min_forward_linear: 0.10
  reverse_linear: -0.18
  rotate_angular: 0.55

  heading_kp: 0.70
  heading_kd: 0.05
  local_goal_kp: 0.35

  slow_heading_error_deg: 35
  rotate_in_place_error_deg: 90

  command_smoothing_alpha: 0.45
  max_linear_delta_per_sec: 0.25
  max_angular_delta_per_sec: 0.80

latency:
  enabled: true
  assumed_latency_sec: 0.50
  angular_scale_deg_per_sec_at_full_cmd: 60.0
  disable_when_stuck: true
  disable_when_signal_low: true

urban:
  checkpoint_radius_m: 15.0
  # A checkpoint counts as "reached" once the rover's GPS fix is within this
  # radius. 15m was wide enough to swallow multiple sequential checkpoints
  # when they're closely spaced (observed: mission1 reported checkpoints
  # 1/2/3 as reached back-to-back with zero drive commands sent). 5m keeps
  # margin for typical outdoor GPS jitter (~2-3m) without spanning adjacent
  # checkpoints on a short course.
  waypoint_switch_radius_m: 5.0
  goal_alignment_weight: 0.45
  traversability_weight: 0.40
  obstacle_weight: 0.60
  turning_cost_weight: 0.10

navigation:
  # Applied only when computing GPS checkpoint heading error; raw telemetry
  # remains unchanged in logs.  Keep this at 0 unless a calibration run proves
  # a fixed rover-specific heading offset.
  rover_heading_offset_deg: 0.0
  heading_filter_alpha: 0.3
  target_heading_deadband_deg: 6.0
  # Jumps at or above this size intentionally bypass heading_filter_alpha's
  # smoothing so a real sharp turn is tracked immediately -- but that also
  # means any heading reading that happens to jump by >=35 deg goes straight
  # through unfiltered. A live run showed current_heading_deg swing between
  # unrelated values (297 -> 213 -> 40 -> 299 deg within about a second),
  # which drove the rover to spin chasing noise. See
  # max_heading_rate_deg_per_sec below for the actual guard against this.
  large_heading_change_deg: 35.0
  # Reject a heading reading if it implies a turn rate faster than this
  # rover can physically do, holding the last accepted heading instead
  # (checkpoint_route.py:_sanitize_heading). 120 deg/s is well above any
  # real rotation this platform reaches at rotate_to_goal_angular /
  # search_rotate_angular, but well below the noise observed above -- set
  # to null to disable.
  max_heading_rate_deg_per_sec: 120.0

planner:
  mode: motion_primitives
  # Finer steps near center let the planner express a small correction
  # (e.g. +5-10 deg) instead of jumping straight to +/-15, which was causing
  # it to commit to a much sharper turn than the situation needed.
  candidate_headings_deg: [-45, -30, -20, -10, -5, 0, 5, 10, 20, 30, 45]
  traversability_weight: 1.0
  goal_heading_weight: 0.7
  continuity_weight: 0.45
  curvature_weight: 0.10
  near_field_risk_weight: 1.5
  path_score_threshold: 0.45
  # near_risk = max(0, near_field_stop_threshold - near_low) in
  # motion_primitive_planner.py:_score_candidates -- this is exactly 0 (no
  # effect on candidate selection at all, despite near_field_risk_weight
  # being the largest weight in the formula) for any candidate whose
  # near-field score is above this threshold, then hard-rejects the
  # candidate once it drops below it. A live run's near_field_score stayed
  # in the 0.83-0.96 range the whole time with 0.25 as the threshold, so
  # this term never engaged; the planner steers purely on goal/traversability
  # until a wall is close enough to crash the score under 0.25, producing a
  # late, sharp correction instead of a gradual one. Raised so the safety
  # term starts contributing while there's still real distance to work with.
  near_field_stop_threshold: 0.6
  near_field_percentile: 10
  full_path_percentile: 15
  candidate_score_ema_alpha: 0.35
  # A committed candidate cannot be switched away from for this long
  # (motion_primitive_planner.py:_select_candidate), regardless of how the
  # scene changes in the meantime. At 0.8s + switch_confirm_count ticks to
  # reconsider, the rover was driving straight along a locked-in heading for
  # ~1s+ before it could correct back toward the goal, overshooting into
  # walls. Shortened so it still damps single-frame noise but re-evaluates
  # fast enough to track a moving heading target.
  min_candidate_commit_sec: 0.35
  transient_invalid_grace_sec: 0.8
  max_plan_age_sec: 1.5
  switch_score_margin: 0.05
  # switch_confirm_count=1 meant a single noisy tick where the opposite
  # extreme candidate (e.g. +45 deg) narrowly out-scored the current one was
  # enough to commit a full switch immediately -- no corroboration required.
  # A live run showed the selected heading jump straight from -45 to +45
  # deg in back-to-back frames this way, which reads as the rover spinning
  # in place. Back to requiring 2 consecutive ticks of agreement before
  # switching; min_candidate_commit_sec above still keeps reaction fast.
  switch_confirm_count: 2
  corridor_half_width_ratio: 0.025
  maximum_visual_heading_deg: 55.0
  debug_candidate_scores: true

perception:
  input_width: 320
  input_height: 240
  use_traversability_model: false
  obstacle_stop_threshold: 0.75
  traversability_threshold: 0.45

safety:
  enable_emergency_stop: true
  frame_timeout_sec: 1.0
  data_timeout_sec: 1.0
  command_loop_delay_limit_sec: 0.5
  sdk_failure_limit: 3

stuck:
  enabled: true
  stuck_time_sec: 3.0
  min_speed_for_not_stuck: 0.03
  min_position_delta_m: 0.15
  low_rpm_threshold: 1.0

recovery:
  enabled: true
  stop_duration_sec: 0.5
  reverse_duration_sec: 1.0
  rotate_duration_sec: 1.2
  reverse_linear: -0.18
  rotate_angular: 0.55
  max_attempts: 3

logging:
  enabled: true
  save_frames: true
  save_debug_images: true
  log_dir: "logs"
